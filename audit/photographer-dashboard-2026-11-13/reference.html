<!doctype html><html lang="vi" style="color-scheme:dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thống kê thợ chụp đã duyệt</title><style>@font-face{font-family:Inter;src:url(/src/assets/fonts/inter-vietnamese-variable.woff2) format("woff2");font-weight:100 900}body{margin:0}</style></head><body><style>
#yume-photographer-dashboard{--yd-page:light-dark(#f6f7f9,#101113);--yd-panel:light-dark(#fff,#191a1f);--yd-ink:light-dark(#202329,#f1f2f5);--yd-muted:light-dark(#626975,#aeb4bf);--yd-line:light-dark(#e0e3e9,#35383f);--yd-soft:light-dark(#f1f3f7,#23252c);--yd-accent:light-dark(#4d5bc5,#a5afff);--yd-tint:light-dark(#eef0fc,#282c48);--yd-blue:light-dark(#397cbe,#8dbcf2);--yd-blue-soft:light-dark(#ecf4fe,#24374b);--yd-danger:light-dark(#a72d3a,#ffadb4);--yd-danger-soft:light-dark(#fff1f2,#3c242a);--yd-warn:light-dark(#91601a,#efce8d);--yd-warn-soft:light-dark(#fff8e9,#352e21);--yd-success:light-dark(#26704c,#9edab9);--yd-success-soft:light-dark(#edf8f1,#23392e);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--yd-ink);background:var(--yd-page);color-scheme:inherit;width:100%;min-width:0}
#yume-photographer-dashboard *{box-sizing:border-box}
#yume-photographer-dashboard :is(h1,h2,h3,p){margin:0}
#yume-photographer-dashboard button,#yume-photographer-dashboard select{font:inherit;color:inherit;cursor:var(--cursor-interactive,pointer)}
#yume-photographer-dashboard button:focus-visible,#yume-photographer-dashboard select:focus-visible{outline:2px solid var(--yd-accent);outline-offset:3px}
#yume-photographer-dashboard [hidden]{display:none!important}
#yume-photographer-dashboard svg{width:16px;height:16px;flex-shrink:0}
#yume-photographer-dashboard .yd-shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
#yume-photographer-dashboard .yd-sidebar{padding:21px 12px 16px;background:var(--yd-panel);border-right:1px solid var(--yd-line);display:flex;flex-direction:column;gap:24px}
#yume-photographer-dashboard .yd-brand{display:flex;gap:10px;align-items:center;padding:0 4px 22px;border-bottom:1px solid var(--yd-line);font-size:13px;font-weight:650}
#yume-photographer-dashboard .yd-logo{width:32px;height:32px;object-fit:contain;border-radius:5px}
#yume-photographer-dashboard .yd-brand small{display:block;font-size:11px;color:var(--yd-muted);font-weight:400;margin-top:3px}
#yume-photographer-dashboard .yd-screen-icon{margin-left:auto;color:var(--yd-muted);padding:7px;border:1px solid var(--yd-line);border-radius:6px;display:grid;place-items:center}
#yume-photographer-dashboard .yd-season{display:grid;gap:6px;padding-bottom:18px;border-bottom:1px solid var(--yd-line)}
#yume-photographer-dashboard .yd-season label{font-size:11px;color:var(--yd-muted);font-weight:600}
#yume-photographer-dashboard select{min-width:0;background:var(--yd-panel);border:1px solid var(--yd-line);border-radius:6px;padding:8px 9px;font-size:12px;max-width:100%}
#yume-photographer-dashboard .yd-nav{display:grid;gap:7px}
#yume-photographer-dashboard .yd-nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;background:transparent;border:0;border-radius:6px;color:var(--yd-muted);text-align:left;font-size:13px}
#yume-photographer-dashboard .yd-nav button:hover{background:var(--yd-soft)}
#yume-photographer-dashboard .yd-nav .yd-active{background:var(--yd-tint);color:var(--yd-accent);box-shadow:inset 3px 0 var(--yd-accent);font-weight:600}
#yume-photographer-dashboard .yd-user{margin-top:auto;border-top:1px solid var(--yd-line);padding:20px 4px 0;display:flex;gap:10px;align-items:center}
#yume-photographer-dashboard .yd-avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:6px;color:var(--yd-accent);background:var(--yd-tint);font-size:12px}
#yume-photographer-dashboard .yd-user p{font-size:12px;font-weight:600}
#yume-photographer-dashboard .yd-user small{display:block;color:var(--yd-accent);font-size:11px;margin-top:4px}
#yume-photographer-dashboard .yd-main{padding:24px;min-width:0}
#yume-photographer-dashboard .yd-mobilebar{display:none}
#yume-photographer-dashboard .yd-breadcrumb{color:var(--yd-muted);font-size:12px;margin-bottom:22px}
#yume-photographer-dashboard .yd-header{margin-bottom:20px}
#yume-photographer-dashboard h1{font-size:24px;line-height:1.3;font-weight:650;letter-spacing:-.6px}
#yume-photographer-dashboard .yd-subtitle{font-size:12px;color:var(--yd-muted);margin-top:7px}
#yume-photographer-dashboard .yd-toolbar{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
#yume-photographer-dashboard .yd-field{display:grid;gap:6px;font-size:11px;font-weight:550}
#yume-photographer-dashboard .yd-field select{min-width:150px}
#yume-photographer-dashboard .yd-today{margin-left:auto;font-size:11px;color:var(--yd-muted);padding-bottom:9px;display:flex;align-items:center;gap:6px}
#yume-photographer-dashboard #yd-overview{display:flex;flex-direction:column;gap:20px}
#yume-photographer-dashboard .yd-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#yume-photographer-dashboard .yd-stat{display:flex;flex-direction:column;align-items:stretch;padding:15px 16px;border:1px solid var(--yd-line);border-radius:8px;background:var(--yd-panel);text-align:left;min-width:0}
#yume-photographer-dashboard .yd-stat:hover{border-color:var(--yd-accent);background:var(--yd-soft)}
#yume-photographer-dashboard .yd-stat-label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--yd-muted)}
#yume-photographer-dashboard .yd-stat-value{display:flex;align-items:baseline;gap:7px;margin-top:10px;font-size:28px;font-weight:650;letter-spacing:-.7px;font-variant-numeric:tabular-nums;line-height:1.2}
#yume-photographer-dashboard .yd-stat-unit{font-size:11px;font-weight:400;letter-spacing:0;color:var(--yd-muted)}
#yume-photographer-dashboard .yd-stat-note{font-size:11px;color:var(--yd-muted);margin-top:8px}
#yume-photographer-dashboard .yd-stat[data-metric='overdue'] .yd-stat-value{color:var(--yd-danger)}
#yume-photographer-dashboard .yd-stat[data-metric='overdue'] .yd-stat-label svg{color:var(--yd-danger)}
#yume-photographer-dashboard .yd-columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(255px,1fr);gap:16px;align-items:stretch}
#yume-photographer-dashboard .yd-panel{min-width:0;border:1px solid var(--yd-line);border-radius:8px;background:var(--yd-panel);overflow:hidden}
#yume-photographer-dashboard .yd-panel-head{display:flex;align-items:start;justify-content:space-between;gap:10px;padding:17px 18px 0}
#yume-photographer-dashboard h2{font-size:15px;font-weight:600;letter-spacing:-.2px}
#yume-photographer-dashboard .yd-panel-sub{font-size:11px;color:var(--yd-muted);margin-top:4px}
#yume-photographer-dashboard .yd-chart{padding:18px 18px 14px}
#yume-photographer-dashboard .yd-chart-body{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
#yume-photographer-dashboard .yd-axis{position:relative;height:160px;color:var(--yd-muted);font-size:11px;font-variant-numeric:tabular-nums}
#yume-photographer-dashboard .yd-axis span{position:absolute;right:0;transform:translateY(-50%)}
#yume-photographer-dashboard .yd-chart-right{min-width:0}
#yume-photographer-dashboard .yd-plot{position:relative;height:160px;display:flex;gap:8px;justify-content:space-around}
#yume-photographer-dashboard .yd-gridline{position:absolute;left:0;right:0;height:1px;background:var(--yd-line);pointer-events:none}
#yume-photographer-dashboard .yd-column{position:relative;flex:1;border:0;background:transparent;min-width:0;padding:0;z-index:1}
#yume-photographer-dashboard .yd-column:hover{background:var(--yd-soft)}
#yume-photographer-dashboard .yd-stack{position:absolute;bottom:0;left:25%;width:50%;display:flex;flex-direction:column;border-radius:4px 4px 0 0}
#yume-photographer-dashboard .yd-bar-concept{background:var(--yd-accent);border-radius:4px 4px 0 0}
#yume-photographer-dashboard .yd-bar-yearbook{background:var(--yd-blue)}
#yume-photographer-dashboard .yd-stack-value{position:absolute;top:-23px;left:0;width:100%;text-align:center;font-size:11px;font-weight:600;color:var(--yd-ink);font-variant-numeric:tabular-nums}
#yume-photographer-dashboard .yd-chart-labels{display:flex;gap:8px;justify-content:space-around;margin-top:10px;font-size:11px;color:var(--yd-muted)}
#yume-photographer-dashboard .yd-chart-labels span{flex:1;text-align:center;min-width:0}
#yume-photographer-dashboard .yd-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:19px;font-size:11px;color:var(--yd-muted)}
#yume-photographer-dashboard .yd-legend span{display:flex;align-items:center;gap:6px}
#yume-photographer-dashboard .yd-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--yd-accent)}
#yume-photographer-dashboard .yd-dot-yearbook{background:var(--yd-blue)}
#yume-photographer-dashboard .yd-text-button{border:0;background:transparent;padding:3px 0;color:var(--yd-accent);font-size:11px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
#yume-photographer-dashboard .yd-text-button:hover{text-decoration:underline}
#yume-photographer-dashboard .yd-tasks{padding:5px 18px 7px}
#yume-photographer-dashboard .yd-task{padding:13px 0;border-bottom:1px solid var(--yd-line);display:grid;gap:6px}
#yume-photographer-dashboard .yd-task:last-child{border:0}
#yume-photographer-dashboard .yd-task-top{display:flex;justify-content:space-between;gap:6px;align-items:start}
#yume-photographer-dashboard .yd-task-title{border:0;background:transparent;padding:0;text-align:left;font-size:12px;font-weight:600}
#yume-photographer-dashboard .yd-task-title:hover{color:var(--yd-accent)}
#yume-photographer-dashboard .yd-task-meta{font-size:11px;color:var(--yd-muted)}
#yume-photographer-dashboard .yd-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.5;padding:3px 6px;border-radius:4px;white-space:nowrap;color:var(--yd-muted);background:var(--yd-soft)}
#yume-photographer-dashboard .yd-tag-danger{color:var(--yd-danger);background:var(--yd-danger-soft)}
#yume-photographer-dashboard .yd-tag-warn{color:var(--yd-warn);background:var(--yd-warn-soft)}
#yume-photographer-dashboard .yd-tag-success{color:var(--yd-success);background:var(--yd-success-soft)}
#yume-photographer-dashboard .yd-tag-concept{color:var(--yd-accent);background:var(--yd-tint)}
#yume-photographer-dashboard .yd-tag-yearbook{color:var(--yd-blue);background:var(--yd-blue-soft)}
#yume-photographer-dashboard .yd-shoot-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto 26px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--yd-line)}
#yume-photographer-dashboard .yd-shoot-row:last-child{border:0}
#yume-photographer-dashboard .yd-date-block{border-radius:6px;background:var(--yd-soft);padding:7px 2px;text-align:center}
#yume-photographer-dashboard .yd-date-block strong{display:block;font-size:18px;font-weight:600;line-height:1.2}
#yume-photographer-dashboard .yd-date-block small{display:block;font-size:11px;color:var(--yd-muted);margin-top:3px}
#yume-photographer-dashboard .yd-shoot-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:600}
#yume-photographer-dashboard .yd-shoot-meta{font-size:11px;color:var(--yd-muted);margin-top:5px;overflow-wrap:anywhere}
#yume-photographer-dashboard .yd-shoot-time{text-align:right;font-size:12px;font-weight:550;font-variant-numeric:tabular-nums}
#yume-photographer-dashboard .yd-shoot-time small{display:block;font-size:11px;font-weight:400;color:var(--yd-muted);margin-top:4px}
#yume-photographer-dashboard .yd-icon-button{border:0;background:transparent;color:var(--yd-muted);padding:6px;display:grid;place-items:center}
#yume-photographer-dashboard .yd-icon-button:hover{color:var(--yd-accent);background:var(--yd-soft);border-radius:4px}
#yume-photographer-dashboard .yd-back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:0;color:var(--yd-accent);font-size:12px;margin-bottom:16px}
#yume-photographer-dashboard .app-back-link,#yume-photographer-dashboard .app-back-link:is(:hover,:focus,:active){text-decoration:none}
#yume-photographer-dashboard .yd-list{padding:0 18px}
#yume-photographer-dashboard .yd-list .yd-shoot-row{grid-template-columns:48px minmax(0,1fr) auto 26px}
#yume-photographer-dashboard .yd-empty{padding:34px 14px;text-align:center;font-size:12px;color:var(--yd-muted)}
#yume-photographer-dashboard .yd-record{padding:20px;display:grid;gap:18px}
#yume-photographer-dashboard .yd-record-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#yume-photographer-dashboard .yd-record-grid dt{font-size:11px;color:var(--yd-muted);margin-bottom:5px}
#yume-photographer-dashboard .yd-record-grid dd{font-size:13px;margin:0;overflow-wrap:anywhere}
#yume-photographer-dashboard .yd-note{padding:13px;background:var(--yd-soft);border-radius:6px;font-size:12px;color:var(--yd-muted)}
@media(max-width:1000px){#yume-photographer-dashboard .yd-columns{grid-template-columns:1fr}#yume-photographer-dashboard .yd-tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#yume-photographer-dashboard .yd-task{border:0}#yume-photographer-dashboard .yd-task-top{display:grid;gap:7px}#yume-photographer-dashboard .yd-tag{justify-self:start}}
@media(max-width:767px){#yume-photographer-dashboard .yd-shell{grid-template-columns:1fr}#yume-photographer-dashboard .yd-sidebar{display:none}#yume-photographer-dashboard .yd-main{padding:16px}#yume-photographer-dashboard .yd-mobilebar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--yd-line);background:var(--yd-panel);font-weight:600;font-size:13px}#yume-photographer-dashboard .yd-mobilebar svg{margin-right:4px}#yume-photographer-dashboard .yd-mobilebar small{margin-left:auto;font-size:11px;font-weight:400;color:var(--yd-muted)}#yume-photographer-dashboard .yd-columns{grid-template-columns:minmax(0,1fr) minmax(235px,.9fr)}#yume-photographer-dashboard .yd-tasks{display:block}#yume-photographer-dashboard .yd-task{border-bottom:1px solid var(--yd-line)}#yume-photographer-dashboard .yd-task-top{display:flex}#yume-photographer-dashboard .yd-breadcrumb{margin-bottom:19px}}
@media(max-width:600px){#yume-photographer-dashboard .yd-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#yume-photographer-dashboard .yd-stat{padding:13px 12px}#yume-photographer-dashboard .yd-stat-label{font-size:11px}#yume-photographer-dashboard .yd-stat-label svg{width:14px;height:14px}#yume-photographer-dashboard .yd-stat-value{font-size:26px}#yume-photographer-dashboard .yd-columns{grid-template-columns:1fr}#yume-photographer-dashboard .yd-toolbar{gap:12px;align-items:start}#yume-photographer-dashboard .yd-field{flex:1;min-width:120px}#yume-photographer-dashboard .yd-field select{min-width:0;width:100%}#yume-photographer-dashboard .yd-today{margin-left:0;flex-basis:100%;padding:0}#yume-photographer-dashboard .yd-header{margin-bottom:18px}#yume-photographer-dashboard h1{font-size:22px}#yume-photographer-dashboard .yd-shoot-row{grid-template-columns:42px minmax(0,1fr) 24px;gap:10px}#yume-photographer-dashboard .yd-shoot-time{grid-column:2;grid-row:2;text-align:left;margin-top:-9px;font-size:11px}#yume-photographer-dashboard .yd-shoot-time small{display:inline;margin-left:8px}#yume-photographer-dashboard .yd-shoot-row>.yd-icon-button{grid-column:3;grid-row:1}#yume-photographer-dashboard .yd-list .yd-shoot-row{grid-template-columns:42px minmax(0,1fr) 24px}#yume-photographer-dashboard .yd-record-grid{grid-template-columns:1fr}#yume-photographer-dashboard .yd-panel-head{padding:15px 14px 0}#yume-photographer-dashboard .yd-tasks{padding-inline:14px}}
@media(pointer:coarse){#yume-photographer-dashboard select{min-height:44px;font-size:16px}#yume-photographer-dashboard .yd-icon-button{min-width:40px;min-height:44px}#yume-photographer-dashboard .yd-text-button,#yume-photographer-dashboard .yd-task-title,#yume-photographer-dashboard .yd-back{min-height:44px}}
</style>

            <div class="yd-chart"><div class="yd-chart-body"><div class="yd-axis" id="yd-axis" aria-hidden="true"></div><div class="yd-chart-right"><div class="yd-plot" id="yd-plot" role="group" aria-label="Số buổi chụp theo tuần, phân biệt concept và kỉ yếu"></div><div class="yd-chart-labels" id="yd-chart-labels" aria-hidden="true"></div></div></div><div class="yd-legend"><span><b class="yd-dot" aria-hidden="true"></b>Concept</span><span><b class="yd-dot yd-dot-yearbook" aria-hidden="true"></b>Kỉ yếu</span></div></div>
          </section>
          <section class="yd-panel" id="yd-priority" aria-labelledby="yd-priority-title"><header class="yd-panel-head"><div><h2 id="yd-priority-title">Cần xử lý</h2><p class="yd-panel-sub">Ưu tiên theo hạn bàn giao</p></div><button type="button" class="yd-text-button" data-open="editing">Xem tất cả<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></button></header><div class="yd-tasks" id="yd-tasks"></div></section>

</div>
<script>
(()=>{
  const root=document.getElementById('yume-photographer-dashboard');
  const today='2026-11-13',now=Date.parse(today+'T09:00:00+07:00'),weekEnd=now+7*86400000;
  const rows=[
    {id:'y01',service:'yearbook',title:'Lớp 12A1',date:'2026-11-02',start:'07:00',end:'11:30',place:'Trường THPT An Bình',role:'lead',status:'completed',completed:'2026-11-10',deadline:'2026-11-12'},
    {id:'c01',service:'concept',title:'Chân dung studio',date:'2026-11-04',start:'09:00',end:'10:00',place:'Yume Studio · Phòng 1',role:'lead',status:'completed',completed:'2026-11-11',deadline:'2026-11-13'},
    {id:'c02',service:'concept',title:'Áo dài studio',date:'2026-11-06',start:'10:00',end:'11:00',place:'Yume Studio · Phòng 2',role:'lead',status:'completed',completed:'2026-11-12',deadline:'2026-11-16'},
    {id:'y00',service:'yearbook',title:'Lớp 12B2',date:'2026-10-28',start:'07:00',end:'13:00',place:'Trường THPT Bình Minh',role:'support',status:'completed',completed:'2026-11-05',deadline:'2026-11-08'},
    {id:'c03',service:'concept',title:'Concept gia đình',date:'2026-11-05',start:'14:00',end:'15:30',place:'Yume Studio · Phòng 1',role:'lead',status:'review',deadline:'2026-11-14'},
    {id:'y02',service:'yearbook',title:'Lớp 12A2',date:'2026-11-07',start:'07:00',end:'13:00',place:'Trường THPT An Bình',role:'support',status:'review',deadline:'2026-11-18'},
    {id:'c04',service:'concept',title:'Chân dung cá nhân',date:'2026-11-03',start:'08:30',end:'09:30',place:'Yume Studio · Phòng 1',role:'lead',status:'editing',deadline:'2026-11-12',note:'Hoàn thiện màu da và kiểm tra bộ ảnh đã chọn trước khi bàn giao.'},
    {id:'y03',service:'yearbook',title:'Lớp 12A3',date:'2026-11-09',start:'07:00',end:'13:00',place:'Trường THPT Bình Minh',role:'support',status:'editing',deadline:'2026-11-16',note:'Hoàn thiện ảnh tập thể và đồng bộ màu các nhóm ảnh.'},
    {id:'c05',service:'concept',title:'Áo dài ngoại cảnh',date:'2026-11-11',start:'08:00',end:'09:30',place:'Vườn hoa Bách Thảo',role:'lead',status:'editing',deadline:'2026-11-17',note:'Giữ màu xanh tự nhiên, ưu tiên bộ ảnh khách đã chọn.'},
    {id:'c06',service:'concept',title:'Chân dung tự nhiên',date:'2026-11-13',start:'14:00',end:'15:00',place:'Yume Studio · Phòng 1',role:'lead',status:'confirmed',deadline:'2026-11-23',note:'Một người. Trang phục tông kem, ưu tiên ánh sáng tự nhiên.'},
    {id:'y04',service:'yearbook',title:'Lớp 12A4',date:'2026-11-14',start:'07:00',end:'11:30',place:'Trường THPT An Bình',role:'support',status:'confirmed',deadline:'2026-11-28',note:'Có mặt trước 15 phút. Phụ trách ảnh nhóm nhỏ và hậu trường.'},
    {id:'c07',service:'concept',title:'Concept cặp đôi',date:'2026-11-16',start:'09:00',end:'10:30',place:'Yume Studio · Phòng 2',role:'lead',status:'confirmed',deadline:'2026-11-26',note:'Hai người. Ưu tiên ảnh tương tác và biểu cảm tự nhiên.'},
    {id:'y05',service:'yearbook',title:'Lớp 12D1',date:'2026-11-19',start:'07:30',end:'15:00',place:'Hoàng thành Thăng Long',role:'lead',status:'confirmed',deadline:'2026-12-03'},
    {id:'c08',service:'concept',title:'Concept gia đình',date:'2026-11-22',start:'10:00',end:'11:30',place:'Yume Studio · Phòng 1',role:'lead',status:'confirmed',deadline:'2026-12-02'},
    {id:'y06',service:'yearbook',title:'Lớp 12A5',date:'2026-11-28',start:'07:00',end:'11:00',place:'Trường THPT Bình Minh',role:'support',status:'confirmed',deadline:'2026-12-12'}
  ];
  const state={period:'month',service:'all',season:'all',view:'dashboard',metric:'shoots',record:'',parent:'dashboard',showPriority:true};
  const $=selector=>root.querySelector(selector);
  const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const displayDate=value=>value.split('-').reverse().join('/');
  const kind=row=>row.service==='concept'?'Concept':'Kỉ yếu';
  const role=row=>row.role==='lead'?'Thợ chính':'Thợ phụ';
  const status={confirmed:'Đã chốt lịch',editing:'Đang hậu kỳ',review:'Chờ nghiệm thu',completed:'Hoàn thành'};
  const metricNames={shoots:'Buổi chụp trong kỳ',upcoming:'Lịch chụp trong 7 ngày tới',editing:'Đơn đang hậu kỳ',review:'Chờ khách nghiệm thu',completed:'Đơn đã hoàn thành',overdue:'Đơn quá hạn bàn giao',calendar:'Lịch chụp sắp tới',all:'Đơn chụp ảnh'};
  function bounds(){return state.period==='previous'?['2026-10-01','2026-10-31']:state.period==='quarter'?['2026-10-01','2026-12-31']:state.period==='year'?['2026-01-01','2026-12-31']:['2026-11-01','2026-11-30'];}
  function scoped(){return rows.filter(row=>(state.service==='all'||row.service===state.service)&&(state.season==='all'||(state.season==='late'?row.date>='2026-11-01':row.date<'2026-11-01')));}
  function inPeriod(value){const [from,to]=bounds();return !!value&&value>=from&&value<=to;}
  function startAt(row){return Date.parse(row.date+'T'+row.start+':00+07:00');}
  function shootRows(){return scoped().filter(row=>inPeriod(row.date));}
  function metricRows(metric){
    if(metric==='completed')return scoped().filter(row=>row.status==='completed'&&inPeriod(row.completed));
    const pool=shootRows();
    if(metric==='shoots'||metric==='all')return pool;
    if(metric==='calendar')return pool.filter(row=>row.status==='confirmed'&&startAt(row)>=now);
    if(metric==='upcoming')return pool.filter(row=>row.status==='confirmed'&&startAt(row)>=now&&startAt(row)<weekEnd);
    if(metric==='overdue')return pool.filter(row=>row.status==='editing'&&row.deadline<today);
    if(metric.startsWith('group:'))return groups()[Number(metric.split(':')[1])]?.rows||[];
    return pool.filter(row=>row.status===metric);
  }
  function groups(){
    const pool=shootRows();
    if(state.period==='year')return Array.from({length:4},(_,index)=>({label:'Quý '+(index+1),long:'Quý '+(index+1)+', 2026',rows:pool.filter(row=>Math.floor((Number(row.date.slice(5,7))-1)/3)===index)}));
    if(state.period==='quarter')return [10,11,12].map(month=>({label:'Tháng '+month,long:'Tháng '+month+', 2026',rows:pool.filter(row=>Number(row.date.slice(5,7))===month)}));
    const month=state.period==='previous'?10:11,last=month===10?31:30;
    return Array.from({length:5},(_,index)=>({label:(index*7+1)+'–'+Math.min(index*7+7,last),long:'Ngày '+(index*7+1)+'–'+Math.min(index*7+7,last)+'/'+month,rows:pool.filter(row=>Math.floor((Number(row.date.slice(8))-1)/7)===index)}));
  }
  function remember(){window.openai?.setWidgetState?.({modelContent:{period:state.period,service:state.service,view:state.view,metric:state.metric},privateContent:{season:state.season,record:state.record,parent:state.parent,showPriority:state.showPriority}})?.catch(()=>{});}
  function apply(saved){const value={...saved?.modelContent,...saved?.privateContent};if(['month','previous','quarter','year'].includes(value.period))state.period=value.period;if(['all','concept','yearbook'].includes(value.service))state.service=value.service;if(['all','autumn','late'].includes(value.season))state.season=value.season;if(['dashboard','list','record'].includes(value.view))state.view=value.view;if(typeof value.metric==='string'&&(metricNames[value.metric]||/^group:\d+$/.test(value.metric)))state.metric=value.metric;if(rows.some(row=>row.id===value.record))state.record=value.record;if(['dashboard','list'].includes(value.parent))state.parent=value.parent;if(typeof value.showPriority==='boolean')state.showPriority=value.showPriority;if(state.view==='record'&&!state.record)state.view='dashboard';}
  function openList(metric){state.view='list';state.metric=metric;state.record='';render();remember();}
  function openRecord(id){state.parent=state.view==='list'?'list':'dashboard';state.view='record';state.record=id;render();remember();}
  function rowMarkup(row,showStatus=false){return `<article class="yd-shoot-row"><div class="yd-date-block"><strong>${Number(row.date.slice(8))}</strong><small>Tháng ${Number(row.date.slice(5,7))}</small></div><div><div class="yd-shoot-title"><button type="button" class="yd-task-title" data-record="${row.id}">${escape(row.title)}</button><span class="yd-tag yd-tag-${row.service}">${kind(row)}</span>${row.date===today?'<span class="yd-tag">Hôm nay</span>':''}</div><p class="yd-shoot-meta">${showStatus?status[row.status]+' · ':''}${escape(row.place)}</p></div><div class="yd-shoot-time">${row.start}–${row.end}<small>${role(row)}</small></div><button type="button" class="yd-icon-button" data-record="${row.id}" aria-label="Xem hồ sơ ${escape(row.title)} ngày ${displayDate(row.date)}"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></article>`;}
  function renderChart(){
    const buckets=groups(),max=Math.max(4,Math.ceil(Math.max(0,...buckets.map(group=>group.rows.length))/4)*4);
    $('#yd-axis').innerHTML=Array.from({length:5},(_,index)=>`<span style="top:${index*25}%">${max-index*max/4}</span>`).join('');
    $('#yd-plot').innerHTML=Array.from({length:5},(_,index)=>`<span class="yd-gridline" style="top:${index*25}%" aria-hidden="true"></span>`).join('')+buckets.map((group,index)=>{const c=group.rows.filter(row=>row.service==='concept').length,y=group.rows.length-c,total=c+y;return `<button type="button" class="yd-column" data-group="${index}" aria-label="${group.long}: ${total} buổi, ${c} concept và ${y} kỉ yếu" data-tooltip="${group.long} · ${c} concept · ${y} kỉ yếu"><span class="yd-stack" style="height:${total/max*100}%"><span class="yd-stack-value">${total}</span><span class="yd-bar-concept" style="height:${total?c/total*100:0}%"></span><span class="yd-bar-yearbook" style="height:${total?y/total*100:0}%"></span></span></button>`;}).join('');
    $('#yd-chart-labels').innerHTML=buckets.map(group=>`<span>${group.label}</span>`).join('');
    $('#yd-chart-caption').textContent=shootRows().length+' buổi được phân công · '+(state.period==='month'?'Theo tuần trong tháng 11':state.period==='previous'?'Theo tuần trong tháng 10':state.period==='year'?'Theo quý':'Theo tháng');
    $('#yd-plot').setAttribute('aria-label','Khối lượng chụp: '+buckets.map(group=>group.long+', '+group.rows.length+' buổi').join('; '));
  }
  function render(){
    $('#yd-period').value=state.period;$('#yd-service').value=state.service;$('#yd-season').value=state.season;
    $('#yd-priority').hidden=!state.showPriority;
    root.querySelector('.yd-columns').style.gridTemplateColumns=state.showPriority?'':'1fr';
    $('#yd-overview').hidden=state.view!=='dashboard';$('#yd-detail').hidden=state.view==='dashboard';$('#yd-back').hidden=state.view==='dashboard';$('#yd-toolbar').hidden=state.view==='record';
    $('#yd-back span').textContent=state.view==='record'&&state.parent==='list'?'Quay lại danh sách':'Quay lại thống kê';
    const activeNav=state.view==='dashboard'?'dashboard':state.metric==='calendar'?'calendar':'orders';
    root.querySelectorAll('[data-nav]').forEach(button=>{const active=button.dataset.nav===activeNav;button.classList.toggle('yd-active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
    const periodLabel=$('#yd-period').selectedOptions[0].textContent,serviceLabel=state.service==='all'?'Concept và kỉ yếu':state.service==='concept'?'Concept':'Kỉ yếu';
    $('#yd-breadcrumb').textContent=state.view==='dashboard'?'Dashboard':'Dashboard / '+(state.view==='record'?'Hồ sơ buổi chụp':'Đơn chụp ảnh');
    $('#yd-title').textContent=state.view==='dashboard'?'Thống kê của tôi':state.view==='record'?(rows.find(row=>row.id===state.record)?.title||'Hồ sơ buổi chụp'):state.metric.startsWith('group:')?(groups()[Number(state.metric.split(':')[1])]?.long||'Buổi chụp'):metricNames[state.metric]||'Đơn chụp ảnh';
    $('#yd-subtitle').textContent=state.view==='dashboard'?'Theo dõi công việc được phân công cho Lê Minh Đức.':periodLabel+' · '+serviceLabel;
    for(const key of ['shoots','upcoming','editing','review','completed','overdue'])$('#yd-count-'+key).textContent=metricRows(key).length;
    const pool=shootRows(),conceptCount=pool.filter(row=>row.service==='concept').length;$('#yd-note-shoots').textContent=conceptCount+' concept · '+(pool.length-conceptCount)+' kỉ yếu';
    renderChart();
    const tasks=metricRows('editing').sort((a,b)=>a.deadline.localeCompare(b.deadline));
    $('#yd-tasks').innerHTML=tasks.length?tasks.slice(0,3).map(row=>{const late=row.deadline<today,days=Math.round((Date.parse(row.deadline)-Date.parse(today))/86400000);return `<article class="yd-task"><div class="yd-task-top"><button type="button" class="yd-task-title" data-record="${row.id}">${escape(row.title)}</button><span class="yd-tag ${late?'yd-tag-danger':'yd-tag-warn'}">${late?'Quá hạn '+Math.abs(days)+' ngày':'Còn '+days+' ngày'}</span></div><p class="yd-task-meta">${kind(row)} · Hạn ${displayDate(row.deadline).slice(0,5)}</p></article>`;}).join(''):'<p class="yd-empty">Không có đơn cần xử lý trong kỳ này.</p>';
    if(state.view==='list'){
      const records=metricRows(state.metric).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
      $('#yd-detail-content').innerHTML=`<div class="yd-panel-head"><div><h2>${records.length} ${['shoots','upcoming','calendar'].includes(state.metric)||state.metric.startsWith('group:')?'buổi chụp':'đơn chụp ảnh'}</h2><p class="yd-panel-sub">Được phân công cho Lê Minh Đức</p></div></div><div class="yd-list">${records.length?records.map(row=>rowMarkup(row,true)).join(''):'<p class="yd-empty">Chưa có công việc phù hợp.</p>'}</div>`;
    }else if(state.view==='record'){
      const row=rows.find(item=>item.id===state.record);
      $('#yd-detail-content').innerHTML=row?`<article class="yd-record"><div><span class="yd-tag yd-tag-${row.service}">${kind(row)}</span> <span class="yd-tag ${row.status==='completed'?'yd-tag-success':''}">${status[row.status]}</span></div><dl class="yd-record-grid"><div><dt>Ngày chụp</dt><dd>${displayDate(row.date)}</dd></div><div><dt>Khung giờ</dt><dd>${row.start}–${row.end}</dd></div><div><dt>Địa điểm</dt><dd>${escape(row.place)}</dd></div><div><dt>Vai trò của bạn</dt><dd>${role(row)}</dd></div><div><dt>Hạn bàn giao</dt><dd>${displayDate(row.deadline)}</dd></div>${row.completed?`<div><dt>Hoàn thành</dt><dd>${displayDate(row.completed)}</dd></div>`:''}</dl>${row.note?`<div class="yd-note">${escape(row.note)}</div>`:''}</article>`:'<p class="yd-empty">Không tìm thấy buổi chụp.</p>';
    }
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
  }
  for(const id of ['period','service','season'])$('#yd-'+id).addEventListener('change',event=>{state[id]=event.target.value;render();remember();});
  root.addEventListener('click',event=>{
    const record=event.target.closest('[data-record]');if(record){openRecord(record.dataset.record);return;}
    const metric=event.target.closest('[data-metric]');if(metric){openList(metric.dataset.metric);return;}
    const action=event.target.closest('[data-open]');if(action){openList(action.dataset.open);return;}
    const group=event.target.closest('[data-group]');if(group){openList('group:'+group.dataset.group);return;}
    const nav=event.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='dashboard'){state.view='dashboard';render();remember();}else openList(nav.dataset.nav==='calendar'?'calendar':'all');}
  });
  $('#yd-back').addEventListener('click',()=>{state.view=state.view==='record'?state.parent:'dashboard';state.record='';render();remember();});
  apply(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){apply(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();remember();}});tweak.addToggle(state,'showPriority',{label:'Hiện danh sách cần xử lý'});}
})();
</script>
</body></html>
