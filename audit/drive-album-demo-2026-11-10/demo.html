<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo album Drive · Yume Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#263329;font:15px/1.6 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #dcded3;background:#fffefa}header span{color:#66725e;font-size:12px;letter-spacing:.1em;text-transform:uppercase}h1{font-size:25px;margin:5px 0}header p{margin:4px 0;color:#5e675b;font-size:13px}.workspace{display:grid;grid-template-columns:275px minmax(0,1fr);gap:24px;max-width:1500px;margin:auto;padding:24px}aside button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:10px 12px;background:transparent;color:#465443;font:inherit;font-size:13px;cursor:pointer}aside button[aria-current=step]{background:#2e4932;color:white}aside button:hover{outline:1px solid #adbba7}.stage{min-width:0}figure{margin:0;background:#e9ece2;border-radius:12px;overflow:hidden;display:flex;justify-content:center;border:1px solid #d2d7c8}figure img{display:block;max-width:100%;max-height:calc(100vh - 310px);width:auto;object-fit:contain}.caption{padding:14px 0;min-height:97px}h2{font-size:21px;margin:0 0 6px}.caption p{margin:0;color:#5e675b}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button.control,a.control{background:#fffefa;border:1px solid #bcc7b4;color:#263329;border-radius:7px;padding:9px 14px;text-decoration:none;cursor:pointer;font:inherit}.control.primary{background:#2e4932;color:white}.count{margin-left:auto;color:#66725e}progress{width:100%;height:5px;accent-color:#6d885b;border:0;margin:12px 0}button:focus-visible,a:focus-visible{outline:3px solid #d88a36;outline-offset:3px}@media(max-width:800px){.workspace{grid-template-columns:1fr;padding:14px;gap:14px}aside{display:flex;overflow-x:auto;gap:4px}aside button{width:auto;min-width:150px}figure img{max-height:60vh}header{padding:16px}.count{margin-left:0}h1{font-size:21px}}</style></head>
<body><header><span>Yume Studio · chạy lại từng bước</span><h1>Luồng album Google Drive</h1><p>Bản ghi từ giao diện và API thật với dữ liệu mẫu riêng. Nguồn Google Drive được mô phỏng; chưa xác minh kết nối Google thật.</p></header>
<div class="workspace"><aside aria-label="Các bước trình diễn" id="steps"></aside><main class="stage"><figure><img id="screen" alt=""></figure><div class="caption" aria-live="polite"><h2 id="title"></h2><p id="description"></p></div><div class="controls"><button class="control" id="previous" aria-label="Bước trước">← Trước</button><button class="control primary" id="play">Tạm dừng</button><button class="control" id="next">Tiếp →</button><button class="control" id="restart">Xem lại từ đầu</button><a class="control" id="zoom" target="_blank" rel="noopener">Xem ảnh lớn</a><span class="count" id="count"></span></div><progress id="progress" max="15" value="1"></progress></main></div>
<script>const frames=[{"image":"step-01.png","title":"Mở từ hồ sơ đơn","description":"Trong mục Bàn giao ảnh, bấm Xem ảnh bàn giao. Cả nguồn Drive, chọn ảnh và ảnh đã chỉnh đều nằm ở đây."},{"image":"step-02.png","title":"Studio tạo album","description":"Nhập tên, link thư mục Drive và số ảnh tối đa khách được chọn. Thư mục Drive phải chia sẻ bằng link."},{"image":"step-03.png","title":"Lấy ảnh và xuất bản","description":"Hệ thống đọc ảnh từ thư mục. Studio kiểm tra album rồi mở cho khách chọn."},{"image":"step-04.png","title":"Gửi link riêng cho khách","description":"Link này cho phép xem và chọn ảnh mà không cần tài khoản. Tạo link mới hoặc thu hồi để ngừng truy cập."},{"image":"step-05.png","title":"Khách mở album","description":"Đây là màn khách nhận được khi mở link. Khách xem ảnh, chọn ảnh yêu thích và ghi yêu cầu chỉnh sửa."},{"image":"step-06.png","title":"Góp ý ngay trên từng ảnh","description":"Khách mở ảnh lớn, thả tim và lưu lời dặn cho đúng tấm ảnh; không cần gửi danh sách qua tin nhắn."},{"image":"step-07.png","title":"Khách chốt danh sách","description":"Kiểm tra lần cuối rồi xác nhận. Danh sách và ghi chú ảnh ban đầu được khóa sau khi gửi."},{"image":"step-08.png","title":"Lựa chọn đã lưu và khóa","description":"Mở lại trên điện thoại vẫn giữ kết quả đã chọn. Khi cần thay đổi, studio có thể mở lại danh sách."},{"image":"step-09.png","title":"Studio lấy danh sách hậu kỳ","description":"Sao chép tên file đã chọn hoặc tải TXT để lọc ảnh trong phần mềm chỉnh sửa."},{"image":"step-10.png","title":"Chuẩn bị ảnh đã chỉnh","description":"Dán thư mục Drive chứa ảnh đã chỉnh, xem trước rồi gửi bản bàn giao mới. Nên dùng thư mục riêng cho từng phiên bản."},{"image":"step-11.png","title":"Giao ảnh trên cùng link","description":"Bản bàn giao mới xuất hiện ngay trong album hiện tại. Studio không cần gửi một link album khác."},{"image":"step-12.png","title":"Khách xem và tải ảnh đã chỉnh","description":"Khách mở lại chính link đã nhận, chuyển sang ảnh đã chỉnh và tải ảnh trực tiếp về máy."},{"image":"step-13.png","title":"Góp ý bản bàn giao","description":"Ghi chú tiếp tục gắn đúng ảnh và phiên bản. Ekip xử lý yêu cầu chỉnh lại; chủ đơn đăng nhập để nghiệm thu."},{"image":"step-14.png","title":"Chủ đơn nghiệm thu tại màn bàn giao","description":"Chủ đơn xem ảnh đã chỉnh, gửi phản hồi hoặc xác nhận ảnh đạt yêu cầu ngay trong tài khoản. Link khách và tài khoản dùng chung album."},{"image":"step-15.png","title":"Thu hồi link khi cần","description":"Sau khi studio thu hồi link, link cũ dừng hoạt động. Quyền chia sẻ thư mục Drive được quản lý riêng trên Google Drive."}];let index=0,playing=true,timer;const $=id=>document.getElementById(id);frames.forEach((f,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+f.title;b.onclick=()=>{playing=false;show(i)};$('steps').append(b)});function show(i){index=Math.max(0,Math.min(frames.length-1,i));const f=frames[index];$('screen').src=f.image;$('screen').alt=f.title;$('title').textContent=f.title;$('description').textContent=f.description;$('count').textContent=(index+1)+' / '+frames.length;$('progress').value=index+1;$('zoom').href=f.image;[...$('steps').children].forEach((b,j)=>{if(j===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('previous').disabled=index===0;$('next').disabled=index===frames.length-1;$('play').textContent=playing?'Tạm dừng':'Phát demo';clearTimeout(timer);if(playing)timer=setTimeout(()=>{if(index===frames.length-1){playing=false;show(index)}else show(index+1)},5500)}$('previous').onclick=()=>{playing=false;show(index-1)};$('next').onclick=()=>{playing=false;show(index+1)};$('play').onclick=()=>{playing=!playing;if(playing&&index===frames.length-1)index=0;show(index)};$('restart').onclick=()=>{playing=true;show(0)};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('previous').click();if(e.key===' '){e.preventDefault();$('play').click()}});show(0);</script></body></html>
